<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>테스트 예수금 관리 · PULSE</title>
  <link rel="stylesheet" href="/style.css"><link rel="icon" href="/favicon.svg">
  <script type="module" src="/cash.mjs"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">PULSE <span>mini HTS</span></a><nav aria-label="메인 메뉴"><a href="/">트레이딩</a><a href="/account">내 계좌</a><a href="/cash" class="active" aria-current="page">예수금 관리</a></nav></header>
  <main class="cash-page">
    <h1>테스트 예수금 관리</h1><p class="muted">공동 계좌의 예수금을 조정합니다. 실제 입출금은 발생하지 않습니다.</p>
    <section class="panel cash-box">
      <dl><div><dt>예수금</dt><dd id="balance">—</dd></div><div><dt>인출 가능 금액</dt><dd id="available">—</dd></div></dl>
      <form id="cash-form">
        <label for="direction">구분</label><select id="direction"><option value="deposit">충전</option><option value="withdraw">인출</option></select>
        <label for="amount">금액 (원)</label><input id="amount" type="text" inputmode="numeric" pattern="[0-9]+" placeholder="금액 입력" required>
        <button id="apply" class="submit buy" type="submit" disabled>충전 요청</button>
      </form>
      <p id="cash-message" role="status" aria-live="polite">서버 잔액 조회 중</p>
      <button id="cash-retry" type="button" hidden>이전 요청 결과 확인</button>
    </section>
  </main>
</body>
</html>
